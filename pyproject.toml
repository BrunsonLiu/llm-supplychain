[project]
name = "supply-chain-agent"
version = "5.0.0"
description = "供应链决策智能体：真实电商数据的需求预测、库存与布点、订单分单、波次拣选和发车仿真，含 Agent v2 与 RAG。"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "lightgbm>=4.0.0",
    "statsmodels>=0.14.0",
    "ortools>=9.8.0",
    "openpyxl>=3.1.0",
    "openai>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.28.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "streamlit>=1.49.0"]
ui = ["streamlit>=1.49.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*", "supply*", "app*"]
