version: '3.8'

services:
  supply-agent-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
    environment:
      - PYTHONPATH=/app/src:/app
      - LOG_LEVEL=INFO
      # 接入真实 LLM 时取消注释并填入（示例为 DeepSeek）：
      # - OPENAI_API_KEY=sk-xxx
      # - OPENAI_BASE_URL=https://api.deepseek.com
      # - LLM_MODEL=deepseek-chat
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
