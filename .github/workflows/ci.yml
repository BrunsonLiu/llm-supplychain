name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RAG core tests
        env:
          PYTHONPATH: src:.
        run: python tests/quick_test.py

      - name: Run supply agent tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_supply.py

      - name: Run demo (mock mode)
        env:
          PYTHONPATH: src:.
        run: python scripts/demo.py
