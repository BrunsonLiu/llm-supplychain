name: CI

on:
  push:
    branches: [ main, master, portfolio-llm-supplychain ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RAG core tests
        env:
          PYTHONPATH: src:.
        run: python tests/quick_test.py

      - name: Run supply agent tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_supply.py

      - name: Run RAG tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_rag.py

      - name: Run comprehensive tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_comprehensive.py

      - name: Run forecasting tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_forecasting.py

      - name: Run inventory tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_inventory.py

      - name: Run network tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_network.py

      - name: Run fulfillment tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_fulfillment.py

      - name: Run wave picking tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_wave.py

      - name: Run wave scheduling tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_wave_schedule.py

      - name: Run online wave release tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_dynamic_wave.py

      - name: Run end-to-end fulfillment tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e.py

      - name: Run end-to-end robustness tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_robustness.py

      - name: Run stock deployment tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_deployment.py

      - name: Run mid-shift recovery tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_recovery.py

      - name: Run joint allocation/placement tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_joint.py

      - name: Run stochastic placement tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_stochastic.py

      - name: Run empirical arrival tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_arrivals.py

      - name: Run outbound dispatch tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_dispatch.py

      - name: Run dock-door tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_dock.py

      - name: Run promise-quoting tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_quote.py

      - name: Run rolling-allocation tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_rolling.py

      - name: Run rolling end-to-end tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_rolling_e2e.py

      - name: Run rolling dock tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_rolling_dock.py

      - name: Run rolling quote tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_rolling_quote.py

      - name: Run promise frontier tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_promise_frontier.py

      - name: Run order acceptance tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_order_acceptance.py

      - name: Run promise-door tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_promise_door.py

      - name: Run same-day consolidation tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_consolidation.py

      - name: Run revenue-acceptance tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_revenue_acceptance.py

      - name: Run value-acceptance tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_e2e_value_acceptance.py

      - name: Run function-agent tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_function_agent.py

      - name: Run agent evaluation
        env:
          PYTHONPATH: src:.
        run: python scripts/run_agent_eval.py --out-dir benchmarks

      - name: Run retrieval evaluation
        env:
          PYTHONPATH: src:.
        run: python scripts/run_retrieval_eval.py --out-dir benchmarks

      - name: Run fulfillment benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_fulfillment_benchmark.py --orders 60 --milp-time 5 --out-dir /tmp/fulfillment-bench

      - name: Run wave picking benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_wave_benchmark.py --orders 60 --milp-time 5 --skip-sensitivity --out-dir /tmp/wave-bench

      - name: Run wave scheduling benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_wave_schedule_benchmark.py --orders 60 --milp-time 5 --schedule-time 3 --skip-sensitivity --out-dir /tmp/wave-schedule-bench

      - name: Run online wave benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_dynamic_wave_benchmark.py --orders 60 --loads 60 --tuning-waits 0 15 --tuning-fills 4 6 --out-dir /tmp/dynamic-wave-bench

      - name: Run end-to-end benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_benchmark.py --orders 100 --milp-time 5 --workers 4 --pickers 1 --picker-sweep 2 3 --out-dir /tmp/e2e-bench

      - name: Run end-to-end robustness benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_robustness.py --orders 80 --seeds 3 --milp-time 5 --workers 4 --out-dir /tmp/e2e-robustness-bench

      - name: Run stock deployment benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_deployment.py --orders 80 --seeds 2 --milp-time 3 --service-time 2 --workers 4 --plans baseline,balanced --out-dir /tmp/stock-deployment-bench

      - name: Run mid-shift recovery benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_recovery.py --orders 80 --seeds 2 --milp-time 3 --service-time 2 --workers 4 --placements baseline,balanced --skip-review-sweep --out-dir /tmp/recovery-bench

      - name: Run joint allocation/placement benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_joint.py --orders 80 --seeds 2 --milp-time 3 --service-time 2 --workers 4 --out-dir /tmp/joint-bench

      - name: Run stochastic placement benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_stochastic.py --orders 80 --seeds 2 --reps 1 --milp-time 3 --service-time 2 --scenario-time 5 --score-time 3 --workers 4 --sweep-lambdas 0 0.5 --out-dir /tmp/stochastic-bench

      - name: Run empirical intraday arrivals benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_empirical_arrivals.py --orders 80 --seeds 2 --milp-time 3 --service-time 2 --workers 4 --out-dir /tmp/empirical-arrivals-bench

      - name: Run outbound dispatch benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_dispatch.py --orders 80 --seeds 2 --milp-time 3 --service-time 2 --workers 4 --out-dir /tmp/dispatch-bench

      - name: Run dock-door benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_dock.py --orders 80 --seeds 2 --milp-time 3 --service-time 2 --workers 4 --out-dir /tmp/dock-bench

      - name: Run promise-quoting benchmark (small)
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_quote.py --orders 80 --seeds 2 --milp-time 3 --service-time 2 --workers 4 --out-dir /tmp/quote-bench

      - name: Run rolling-allocation benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_rolling.py --orders 80 --milp-time 2 --service-time 1 --workers 2 --baseline-milp-time 3 --baseline-service-time 2 --out-dir /tmp/rolling-bench

      - name: Run rolling end-to-end benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_rolling_e2e.py --orders 80 --seeds 3 --milp-time 2 --service-time 1 --baseline-milp-time 3 --baseline-service-time 2 --workers 2 --out-dir /tmp/rolling-e2e-bench

      - name: Run rolling dock benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_rolling_dock.py --orders 80 --seeds 3 --milp-time 2 --service-time 1 --baseline-milp-time 3 --baseline-service-time 2 --workers 2 --out-dir /tmp/rolling-dock-bench

      - name: Run rolling quote benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_rolling_quote.py --orders 80 --seeds 3 --milp-time 2 --service-time 1 --baseline-milp-time 3 --baseline-service-time 2 --workers 2 --out-dir /tmp/rolling-quote-bench

      - name: Run promise frontier benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_promise_frontier.py --orders 80 --seeds 3 --milp-time 2 --service-time 1 --baseline-milp-time 3 --baseline-service-time 2 --workers 2 --out-dir /tmp/promise-frontier-bench

      - name: Run order acceptance benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_order_acceptance.py --orders 80 --seeds 3 --milp-time 2 --service-time 1 --baseline-milp-time 3 --baseline-service-time 2 --workers 2 --out-dir /tmp/order-acceptance-bench

      - name: Run promise-door benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_promise_door.py --orders 80 --seeds 3 --milp-time 2 --service-time 1 --baseline-milp-time 3 --baseline-service-time 2 --workers 2 --out-dir /tmp/promise-door-bench

      - name: Run same-day consolidation benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_consolidation.py --orders 80 --seeds 3 --milp-time 2 --service-time 1 --workers 2 --out-dir /tmp/consolidation-bench

      - name: Run revenue-acceptance benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_revenue_acceptance.py --orders 80 --seeds 3 --milp-time 2 --service-time 1 --baseline-milp-time 3 --baseline-service-time 2 --workers 2 --out-dir /tmp/revenue-bench

      - name: Run value-acceptance benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/run_e2e_value_acceptance.py --orders 80 --seeds 3 --milp-time 2 --service-time 1 --baseline-milp-time 3 --baseline-service-time 2 --workers 2 --out-dir /tmp/value-bench

      - name: Install optional UI dependency
        run: pip install "streamlit>=1.49"

      - name: Run Streamlit UI smoke tests
        env:
          PYTHONPATH: src:.
        run: python tests/test_ui_smoke.py

      - name: Run demo (mock mode)
        env:
          PYTHONPATH: src:.
        run: python scripts/demo.py
